name: Deploy Crawler (Railway)

on:
  push:
    branches: [main]
    paths:
      - 'apps/crawler/**'
      - 'packages/shared/**'
      - 'packages/database/**'
      - '.github/workflows/deploy-crawler.yml'

jobs:
  deploy-crawler:
    name: Deploy Crawler to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Crawler
        run: pnpm --filter @whats-up-addis/crawler build

      # TODO: Add Railway deployment when Railway is configured
      # - name: Deploy to Railway
      #   uses: railway/railway-deploy@v3
      #   with:
      #     railway-token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: crawler
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #     CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      #     CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      #     CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Placeholder - Railway not yet configured
        run: |
          echo "Crawler deployment workflow created but Railway deployment not yet configured"
          echo "To enable Railway deployment:"
          echo "1. Set up Railway project for crawler"
          echo "2. Add RAILWAY_TOKEN to GitHub secrets"
          echo "3. Add necessary environment variables to GitHub secrets"
          echo "4. Uncomment the Railway deployment step above"
