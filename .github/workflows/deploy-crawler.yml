name: Deploy Crawler (Railway)

on:
  push:
    branches: [main]
    paths:
      - 'apps/crawler/**'
      - 'packages/shared/**'
      - 'packages/database/**'
      - '.github/workflows/deploy-crawler.yml'
env:
  NODE_VERSION: '22'

jobs:
  deploy-crawler:
    name: Deploy Crawler to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build Crawler
        run: pnpm --filter @whats-up-addis/crawler build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Crawler to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway up --service crawler --detach
          railway status --service crawler

      - name: Verify Deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deployment complete! Checking service status..."
          railway status --service crawler
          echo "View logs with: railway logs --service crawler"
